<!DOCTYPE html>
<html>
<head>
  <title>Game</title>
  <style>
    body {
      background: #0f0f0f;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    .box {
      background: #1e1e1e;
      padding: 20px;
      margin: 15px auto;
      border-radius: 12px;
      max-width: 400px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    input {
      width: 90%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: none;
    }

    button {
      padding: 10px 15px;
      margin: 5px;
      border-radius: 6px;
      border: none;
      background: #ff3b3b;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #ff5c5c;
    }

    .playerBtn {
      display: block;
      width: 100%;
      margin: 5px 0;
    }

    #role {
      font-size: 20px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<h2 id="roomTitle"></h2>

<div class="box" id="setup">
  <h3>Host Setup</h3>
  <input id="category" placeholder="Category">
  <input id="word" placeholder="Secret Word">
  <button onclick="startGame()">Start Game</button>
</div>

<div class="box">
  <h3>Your Role</h3>
  <div id="role">Waiting for game to start...</div>
</div>

<div class="box">
  <h3>Vote</h3>
  <div id="players"></div>
  <button onclick="submitVote()">Submit Vote</button>
</div>

<div class="box">
  <h3>Result</h3>
  <div id="result"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="script.js"></script>

</body>
</html>
